<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #ece9e6, #ffffff);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      }

      .btn-primary {
        background: linear-gradient(45deg, #4e9af1, #2c7be5);
        border: none;
      }

      .btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(46, 134, 255, 0.4);
      }

      .form-control {
        border-radius: 12px;
        padding: 0.75rem 1rem;
      }

      .reservation-card {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <button
        id="logout-btn"
        class="btn btn-outline-danger btn-lg rounded-pill"
      >
        Logout
      </button>
      <!-- Title -->
      <h1 class="text-center mb-5 fw-bold text-dark display-5">
        Admin Dashboard
      </h1>

      <!-- Reservations Section -->
      <h4 class="fw-bold text-success mb-4">Reservations</h4>
      <div id="reservations" class="row g-4 mb-5">
        <!-- Reservation cards will be added by JS (4 per row) -->
      </div>

      <hr class="my-5 opacity-25" />

      <!-- Menu Items Section -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Menu Items</h2>
        <button
          id="show-add-form-btn"
          class="btn btn-primary btn-lg rounded-pill"
        >
          Add Menu Item
        </button>
      </div>

      <!-- Add Menu Form -->
      <div id="menu-form-container" style="display: none" class="mb-5">
        <div class="card shadow-lg p-4" style="background: #fdfdfd">
          <h4 id="form-title" class="mb-4 fw-bold text-primary">
            Add Menu Item
          </h4>
          <form id="add-menu-form">
            <input
              class="form-control mb-3"
              id="title"
              placeholder="Title"
              required
            />
            <input
              class="form-control mb-3"
              id="description"
              placeholder="Description"
            />
            <input
              class="form-control mb-3"
              id="price"
              type="number"
              placeholder="Price"
              required
            />
            <input
              class="form-control mb-3"
              id="category"
              placeholder="Category"
              required
            />
            <input
              class="form-control mb-4"
              id="image"
              placeholder="Image URL"
            />
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm"
            >
              Add Item
            </button>
          </form>
        </div>
      </div>

      <!-- Menu Items List -->
      <div id="menu-list" class="row g-4">
        <!-- Menu cards populated by JS -->
      </div>
    </div>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
